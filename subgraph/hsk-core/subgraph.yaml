specVersion: 0.0.5
description: >
  hsk-core — starter Uniswap-V2-style subgraph for HashKey Chain. See README.md
  before deploying: FACTORY_ADDRESS_PLACEHOLDER must be replaced with a
  verified DEX factory contract address on HSK; nothing here is deployed by
  default and V52_GRAPH_ENDPOINT_HSK stays unset until it is.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: hashkeychain
    source:
      address: "FACTORY_ADDRESS_PLACEHOLDER"
      abi: Factory
      startBlock: FACTORY_START_BLOCK_PLACEHOLDER
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pair
        - Token
      abis:
        - name: Factory
          file: ./abis/Factory.json
        - name: Pair
          file: ./abis/Pair.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handleNewPair
      file: ./src/factory.ts
templates:
  - kind: ethereum/contract
    name: Pair
    network: hashkeychain
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - Pair
      abis:
        - name: Pair
          file: ./abis/Pair.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Sync(uint112,uint112)
          handler: handleSync
      file: ./src/pair.ts
